<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="InkDriver: native macOS driver for the XP-Pen Deco 01 V3">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#111a2e"/>
      <stop offset="100%" stop-color="#0d1626"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.42" r="0.55">
      <stop offset="0%" stop-color="#4a6be8" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#4a6be8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22304d"/>
      <stop offset="100%" stop-color="#161f33"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16203a"/>
      <stop offset="100%" stop-color="#0e1729"/>
    </linearGradient>
    <linearGradient id="pen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6d8bf5"/>
      <stop offset="100%" stop-color="#3f5fd6"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#8fa7d8" opacity="0.13"/>
    </pattern>
    <pattern id="grid" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M14 0H0V14" fill="none" stroke="#7f9ad6" stroke-opacity="0.16" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="18" fill="url(#dots)"/>
  <rect width="1200" height="420" rx="18" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="419" rx="18" fill="none" stroke="#33405e"/>

  <!-- ================= left: title ================= -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="56" y="86" font-size="46" font-weight="700" fill="#f8fafc" letter-spacing="-0.5">InkDriver</text>
    <text x="56" y="124" font-size="17" fill="#9db0d0">Native macOS driver + menu-bar app</text>
    <text x="56" y="148" font-size="17" fill="#9db0d0">for the XP-Pen Deco 01 V3</text>

    <!-- badges -->
    <g font-size="12.5" font-weight="600">
      <rect x="56" y="176" width="86" height="26" rx="13" fill="#1b2740" stroke="#3a4a6b"/>
      <text x="99" y="193" fill="#9db0d0" text-anchor="middle">arm64</text>

      <rect x="150" y="176" width="118" height="26" rx="13" fill="#1b2740" stroke="#3a4a6b"/>
      <text x="209" y="193" fill="#9db0d0" text-anchor="middle">no vendor code</text>

      <rect x="276" y="176" width="118" height="26" rx="13" fill="#17243c" stroke="#4a6be8"/>
      <text x="335" y="193" fill="#a9bcff" text-anchor="middle">no telemetry</text>

      <rect x="402" y="176" width="112" height="26" rx="13" fill="#17243c" stroke="#4a6be8"/>
      <text x="458" y="193" fill="#a9bcff" text-anchor="middle">GPL-3.0</text>
    </g>

    <!-- pipeline caption -->
    <text x="56" y="252" font-size="13" fill="#6f83a6" letter-spacing="0.3">IOKIT HID</text>
    <path d="M138 248 h22" stroke="#40507a" stroke-width="1.4"/>
    <text x="170" y="252" font-size="13" fill="#6f83a6" letter-spacing="0.3">PARSE</text>
    <path d="M216 248 h22" stroke="#40507a" stroke-width="1.4"/>
    <text x="248" y="252" font-size="13" fill="#6f83a6" letter-spacing="0.3">MAP</text>
    <path d="M288 248 h22" stroke="#40507a" stroke-width="1.4"/>
    <text x="320" y="252" font-size="13" fill="#6f83a6" letter-spacing="0.3">CGEVENT</text>

    <text x="56" y="300" font-size="14" fill="#8497b8">14-bit pressure &#183; tilt &#183; 8 express keys &#183; wheel mode</text>
    <text x="56" y="326" font-size="14" fill="#8497b8">per-display mapping &#183; 867 KB &#183; 3,541 lines</text>

    <text x="56" y="372" font-size="12.5" fill="#5d6f90">No network code. 48 Apple API entry points. Verifiable with one command.</text>
  </g>

  <!-- ================= right: tablet ================= -->
  <g>
    <!-- shadow -->
    <rect x="614" y="152" width="268" height="182" rx="16" fill="#05080f" opacity="0.55"/>
    <!-- body -->
    <rect x="608" y="144" width="268" height="182" rx="16" fill="url(#body)" stroke="#3d4d70" stroke-width="1.5"/>
    <!-- active area -->
    <rect x="676" y="162" width="186" height="146" rx="7" fill="#0a1120" stroke="#33415f"/>
    <rect x="676" y="162" width="186" height="146" rx="7" fill="url(#grid)"/>
    <!-- corner marks on the active area -->
    <path d="M684 170 h12 M684 170 v12" stroke="#4a6be8" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <path d="M854 300 h-12 M854 300 v-12" stroke="#4a6be8" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

    <!-- 8 express keys -->
    <g>
      <rect x="622" y="160" width="40" height="15" rx="4" fill="#4a6be8"/>
      <rect x="622" y="181" width="40" height="15" rx="4" fill="#2b3a58" stroke="#41527a"/>
      <rect x="622" y="202" width="40" height="15" rx="4" fill="#2b3a58" stroke="#41527a"/>
      <rect x="622" y="223" width="40" height="15" rx="4" fill="#2b3a58" stroke="#41527a"/>
      <rect x="622" y="244" width="40" height="15" rx="4" fill="#2b3a58" stroke="#41527a"/>
      <rect x="622" y="265" width="40" height="15" rx="4" fill="#2b3a58" stroke="#41527a"/>
      <rect x="622" y="286" width="40" height="15" rx="4" fill="#2b3a58" stroke="#41527a"/>
      <rect x="622" y="307" width="40" height="15" rx="4" fill="#2b3a58" stroke="#41527a"/>
    </g>

    <!-- pen lying across the active area -->
    <g transform="rotate(-34 770 236)">
      <rect x="756" y="231" width="116" height="17" rx="8.5" fill="#05080f" opacity="0.45"/>
      <rect x="754" y="227" width="116" height="17" rx="8.5" fill="url(#pen)" stroke="#0d1526" stroke-width="1.6"/>
      <rect x="762" y="230" width="98" height="3.6" rx="1.8" fill="#ffffff" opacity="0.20"/>
      <rect x="816" y="227" width="7" height="17" fill="#0d1526" opacity="0.28"/>
      <path d="M754 227 L726 235.5 L754 244 Z" fill="#f2b84b" stroke="#0d1526" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M748 232 L732 235.5 L748 239 Z" fill="#ffffff" opacity="0.22"/>
      <rect x="856" y="229" width="14" height="13" rx="3" fill="#2f4bb0"/>
    </g>
  </g>

  <!-- ================= arrow ================= -->
  <g>
    <path d="M886 236 h34" stroke="#4a6be8" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M915 229 l9 7 -9 7" fill="none" stroke="#4a6be8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="902" y="272" font-size="11.5" fill="#7f93b8" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">CGEvent</text>
  </g>

  <!-- ================= right: display ================= -->
  <g>
    <!-- stand -->
    <rect x="1022" y="330" width="26" height="26" fill="#1a2438" stroke="#33415f"/>
    <rect x="984" y="354" width="102" height="9" rx="4.5" fill="#1a2438" stroke="#33415f"/>

    <!-- bezel + screen -->
    <rect x="938" y="128" width="196" height="206" rx="12" fill="#0a0f1c" stroke="#3d4d70" stroke-width="1.5"/>
    <rect x="948" y="138" width="176" height="178" rx="6" fill="url(#screen)"/>

    <!-- window chrome -->
    <rect x="948" y="138" width="176" height="20" rx="6" fill="#1b2740"/>
    <circle cx="961" cy="148" r="3.2" fill="#f2b84b"/>
    <circle cx="972" cy="148" r="3.2" fill="#5d6f90"/>
    <circle cx="983" cy="148" r="3.2" fill="#5d6f90"/>

    <!-- canvas -->
    <rect x="958" y="168" width="156" height="138" rx="4" fill="#0c1424" stroke="#26324c"/>

    <!-- pressure-varying ink stroke -->
    <path d="M972 268
             C 1000 232 1030 208 1058 219
             C 1088 231 1100 252 1124 258
             L 1122 265
             C 1098 260 1086 240 1058 228
             C 1030 217 1000 241 974 275 Z"
          fill="#4a6be8" opacity="0.95"/>

    <!-- cursor -->
    <path d="M1118 274 l0 16 4-4 3 7 3-2 -3-6 6-1 z" fill="#f8fafc" stroke="#0c1424" stroke-width="1"/>
  </g>

</svg>
